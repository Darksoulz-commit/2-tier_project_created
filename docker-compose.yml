services:
  backend_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 400M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - backend_network
    volumes:
      - db-data:/var/lib/mysql

  frontend_web:
    image: multistage-app
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 400M
    depends_on:
      backend_db:
        condition: service_healthy
    networks:
      - frontend_network
      - backend_network

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge

volumes:
  db-data:
